<shared-map-list-panel [items]="warnings"
                       [selectedId]="selectedWarningId"
                       [labels]="labels"
                       storageKey="pisac.mapPanel.collapsed"
                       [sortFn]="sortFn"
                       [searchTextFn]="searchTextFn"
                       (itemSelected)="warningSelected.emit($event)"
                       (collapsedChange)="collapsedChange.emit($event)">
  <ng-template let-warning>
    <span class="map-list-card__top">
      <span class="map-list-card__number">{{ warning | formatWarningNumber }}</span>
      <span class="map-list-card__type" [attr.data-type]="warning.globalWarningType">
        {{ ('map-panel.type.' + warning.globalWarningType) | translate }}
      </span>
    </span>
    <span class="map-list-card__detail">{{ typeDetails(warning) }}</span>
    <span class="map-list-card__action">
      <i class="pi pi-map-marker"></i>
      <span translate>map-panel.locate</span>
    </span>
  </ng-template>
</shared-map-list-panel>
