<!-- PISAC (F5.3.5): invitación a iniciar sesión o registrarse en una tarjeta centrada. Botones de 42 px (antes,
     redondeados con texto de 25 px). Mismos eventos. -->
<div class="pisac-form-page pisac-form-page--narrow sign-in-up-page">
  <pisac-card icon="pi pi-user" title="account.sign-in-up.title">
    <p class="sign-in-up-page-item main-title" *ngIf="section === 'contribution'">{{'infosource.sign-in-up-contribute-message' | translate}}</p>
    <p class="sign-in-up-page-item main-title" *ngIf="section === 'subscription'">{{'subscription.sign-in-up-subscription-message' | translate}}</p>
    <div class="sign-in-up-page-item sign-in-up-actions">
      <button pButton type="button" icon="pi pi-sign-in" (click)="goToPublicLoginPage()" [label]="'account-panel.already-registered.button.title' | translate"></button>
      <button pButton type="button" icon="pi pi-user-plus" class="p-button-outlined" (click)="goToAccountCreation()" [label]="'account-panel.create-button.title' | translate"></button>
      <button pButton type="button" icon="pi pi-lock" class="p-button-text button-pro" (click)="goToProLoginPage()" [label]="'account-panel.already-registered.button.title.pro' | translate"></button>
    </div>
  </pisac-card>
</div>
