<footer class="pisac-footer" role="contentinfo">
  <div class="pisac-footer__body">
    <!-- Franja de gobierno en una sola imagen: bandera y República Bolivariana de Venezuela | Ministerio del Poder
         Popular para la Defensa | Armada Bolivariana (antes los logotipos estáticos logo-mer y logo-armada). -->
    <div class="pisac-footer__brand">
      <img class="pisac-footer__gov" src="assets/images/pie-gobierno.png" width="333" height="46"
           alt="República Bolivariana de Venezuela · Ministerio del Poder Popular para la Defensa · Armada Bolivariana">
    </div>
    <nav class="pisac-footer__links">
      <ul>
        <li>
          <a target="_blank" rel="noopener external" href="https://presidencia.gob.ve/"
            [title]="'footer.external-link-title' | translate:{site: 'presidencia.gob.ve'}">presidencia.gob.ve</a>
        </li>
        <li>
          <a target="_blank" rel="noopener external" href="https://www.mindefensa.gob.ve/"
            [title]="'footer.external-link-title' | translate:{site: 'mindefensa.gob.ve'}">mindefensa.gob.ve</a>
        </li>
        <li>
          <a target="_blank" rel="noopener external" href="https://www.armada.mil.ve/"
            [title]="'footer.external-link-title' | translate:{site: 'armada.mil.ve'}">armada.mil.ve</a>
        </li>
        <li>
          <a target="_blank" rel="noopener external" href="http://www.shn.gob.ve/"
            [title]="'footer.external-link-title' | translate:{site: 'shn.gob.ve'}">shn.gob.ve</a>
        </li>
        <li>
          <a target="_blank" rel="noopener external" href="http://www.ochina.gob.ve/"
            [title]="'footer.external-link-title' | translate:{site: 'ochina.gob.ve'}">ochina.gob.ve</a>
        </li>
      </ul>
    </nav>
  </div>
  <div class="pisac-footer__bar">
    <span translate>title.description</span>
  </div>
  <!-- Enlaces legales de SHOM (accesibilidad, aviso legal, CGU, contacto) desactivados en PISAC:
  <ul>
    <li><a [routerLink]="[baseStaticPath, 'accessibilite']" translate>footer.accessibility</a></li>
    <li><a [routerLink]="[baseStaticPath, 'mentions-legales']" translate>footer.legal-notice</a></li>
    <li><a [routerLink]="[baseStaticPath, 'cgu']" translate>footer.cgu</a></li>
    <li><a [routerLink]="[baseStaticPath, 'contact']" translate>footer.contact</a></li>
  </ul>
  -->
</footer>
