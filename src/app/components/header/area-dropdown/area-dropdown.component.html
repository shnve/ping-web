<p-dropdown
  [options]="groupedAreas$ | async"
  [group]="true"
  class="area-dropdown"
  [optionLabel]="displayedOptionLabel"
  optionValue="value"
  filter="true"
  [filterLocale]="'lang' | translate"
  resetFilterOnHide="true"
  [emptyFilterMessage]="'menu.area.dropdown.not-found' | translate"
  [(ngModel)]="selectedArea"
  (ngModelChange)="onSelectArea($event)"
  [placeholder]="'menu.area.select-area' | translate"
  [title]="'menu.area.select-area' | translate"
  [appendTo]="'body'"
>
  <ng-template let-group pTemplate="group">
    <div class="area-group-header">
      <span>{{ group.label }}</span>
    </div>
  </ng-template>
  <ng-template let-item pTemplate="item">
    <div class="area-item-option" [class.subarea-option]="item.isSubArea">
      <span>{{ item[displayedOptionLabel] || item.name || item.label }}</span>
    </div>
  </ng-template>
</p-dropdown>
