<!-- PISAC (F5.3.2): año, texto, autoridades y fecha en una rejilla de 4 columnas; vista previa del número debajo -->
<div class="number-container">
    <div class="number-grid">
        <p-dropdown #dropdownYear [(ngModel)]="year"
                    [options]="availableYears"
                    [autoDisplayFirst]="false"
                    [filter]="true"
                    [showClear]="true"
                    resetFilterOnHide="true"
                    [placeholder]="'georegulation.creation.number.year-placeholder' | translate"
                    (ngModelChange)="propertiesChanged()"
                    [ngClass]="{'error': invalidNumber}"
                    ngDefaultControl
                    [disabled]="disabled"
        ></p-dropdown>
        <input type="text" pInputText [(ngModel)]="text"
                (ngModelChange)="propertiesChanged()"
                [placeholder]="'georegulation.creation.number.text-placeholder' | translate"
                [disabled]="disabled">
        <p-multiSelect [(ngModel)]="authorities"
                [options]="availableAuthorities"
                [filter]="true"
                [optionLabel]="authoritiesOptionLabel"
                [placeholder]="'georegulation.creation.number.authorities-default-label' | translate"
                class="multiselect"
                resetFilterOnHide="true"
                (ngModelChange)="propertiesChanged()"
                ngDefaultControl
                [disabled]="disabled"
        ></p-multiSelect>
        <p-calendar monthNavigator="true"
            yearNavigator="true"
            hourFormat="24"
            [yearRange]="yearRange"
            [showTime]="false"
            [showIcon]="true"
            dateFormat="ddmmyy"
            [placeholder]="'georegulation.creation.number.date-placeholder' | translate"
            [firstDayOfWeek]="'filter.filter-form.first-day-of-week' | translate"
            [(ngModel)]="date"
            (ngModelChange)="propertiesChanged()"
            [ngClass]="{'error': invalidNumber}"
            dataType="string"
            [disabled]="disabled"
        ></p-calendar>
    </div>

    <!-- message if number is incomplete -->
    <small class="p-error" *ngIf="invalidNumber" translate>georegulation.creation.errors.incomplete-number</small>

    <div class="number-preview" *ngIf="grNumber | georegulationFormatNumber as preview">
        <i class="pi pi-hashtag" aria-hidden="true"></i>{{ preview }}
    </div>
</div>
