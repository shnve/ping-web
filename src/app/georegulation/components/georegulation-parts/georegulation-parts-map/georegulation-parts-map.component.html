<sig-map #map class="map" [extent]="selectedAreaExtent" [georegulationId]="georegulationId"
        [modulesOptions]="modulesOptions" [enableKmlImport]="true" [enableLayersShowHide]="true" [parentLayers]="false"
        [kmlImportCallback]="onImportKmlClick.bind(this)" [getDetailWarnings]="false" [showLayers]="false"
        [showZoneX]="false" [showWarnings]="true" [showGeoregulations]="false" [canShowHideGeoregulationLayers]="true"
        [canShowRasterMarineLayer]="true" [enableGotoLegend]="false"
        [enableLabelsShowHide]="false" [isGeoregulationStyle]="true" [georegulationIssuingServiceId]="issuingServiceId"
        [popover]="true" [disabled]="disabled" [geometriesLayer]="geometriesLayer" (onLoad)="mapLoaded()"
        [enableLayerMaritimesEntitiesManagedOrObservedByService]="true"></sig-map>
<input type="file" id="kmlFile" [accept]="kmlImportAccept" style="display:none">

<!-- INGRESO MANUAL DE COORDENADAS -->
<!-- PISAC (F5.3.2): panel sin estilos en línea; campos con pInputText y botones del tema (como en avisos) -->
<div *ngIf="!disabled" class="manual-coords-panel pisac-panel-muted">
  <h3 class="pisac-subsection-title"><i class="pi pi-map-marker" aria-hidden="true"></i>{{ 'carto.manual-coords.title' | translate }}</h3>

  <div class="manual-coords-row">
    <!-- Bloque Latitud -->
    <div class="pisac-field manual-coords-field">
      <label for="gr-manual-coords-lat">{{ 'COORDINATES.LATITUDE' | translate }}</label>
      <input type="text" id="gr-manual-coords-lat" pInputText
             [(ngModel)]="latText" (ngModelChange)="latText = $event.toUpperCase()" [ngModelOptions]="{standalone: true}"
             class="form-control"
             placeholder="Ej: 49-59.61N" pattern="^(0[0-9]|[1-8][0-9]|90)-(0[0-9]|[1-5][0-9])(\.\d+)?[NS]$"
             #latInput="ngModel">
      <small *ngIf="latInput.invalid && latInput.dirty" class="p-error">Formato inválido</small>
    </div>

    <!-- Bloque Longitud -->
    <div class="pisac-field manual-coords-field">
      <label for="gr-manual-coords-lon">{{ 'COORDINATES.LONGITUDE' | translate }}</label>
      <input type="text" id="gr-manual-coords-lon" pInputText
             [(ngModel)]="lonText" (ngModelChange)="lonText = $event.toUpperCase()" [ngModelOptions]="{standalone: true}"
             class="form-control"
             placeholder="Ej: 001-13.50E" pattern="^(0[0-9]{2}|1[0-7][0-9]|180)-(0[0-9]|[1-5][0-9])(\.\d+)?[EW]$"
             #lonInput="ngModel">
      <small *ngIf="lonInput.invalid && lonInput.dirty" class="p-error">Formato inválido</small>
    </div>

    <!-- Botones -->
    <div class="manual-coords-actions">
      <button pButton type="button" icon="pi pi-map-marker" (click)="addPointToMap()"
              [label]="'carto.manual-coords.add-vertex' | translate"></button>
      <button pButton type="button" icon="pi pi-trash" class="p-button-outlined p-button-danger" (click)="clearManualCoords()"
              [label]="'carto.manual-coords.clear' | translate"></button>
    </div>
  </div>
</div>
