<sig-map #map class="map"
        [extent]="selectedAreaExtent"
        [georegulationId]="georegulationId"
        [modulesOptions]="modulesOptions"
        [enableKmlImport]="true"
        [enableLayersShowHide]="true"
        [parentLayers]="false"
        [kmlImportCallback]="onImportKmlClick.bind(this)"
        [getDetailWarnings]="false"
        [showLayers]="false"
        [showZoneX]="false"
        [showWarnings]="true"
        [showGeoregulations]="false"
        [canShowHideGeoregulationLayers]="true"
        [canShowRasterMarineLayer]="true"
        [canShowOrthoIGNLayer]="true"
        [enableGotoLegend]="false"
        [enableLabelsShowHide]="false"
        [isGeoregulationStyle]="true"
        [georegulationIssuingServiceId]="issuingServiceId"
        [popover]="true"
        [disabled]="disabled"
        [geometriesLayer]="geometriesLayer"
        (onLoad)="mapLoaded()"
        [enableLayerMaritimesEntitiesManagedOrObservedByService]="true"
></sig-map>
<input type="file" id="kmlFile" [accept]="kmlImportAccept" style="display:none">
