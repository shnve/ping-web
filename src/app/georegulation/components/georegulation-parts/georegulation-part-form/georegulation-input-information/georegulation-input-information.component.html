<!-- PISAC (F5.3.2): un bloque por idioma con texto, opciones de inserción (etiqueta arriba) y la vista de
     geometrías para copiar. Se quitan las etiquetas anidadas (<label> dentro de <label>). -->
<div *ngFor="let lang of langs; let index = index" class="div-info lang-block">
  <label class="lang-header" [attr.for]="'gr-information-' + lang">
    <span class="lang-label">{{lang | uppercase}}</span>
  </label>
  <textarea pInputTextarea [id]="'gr-information-' + lang" [rows]="8" [(ngModel)]="informations[lang]" (ngModelChange)="informationsChanged()">
  </textarea>

  <div class="btn-toolbar">
    <div class="pisac-field">
      <label [attr.for]="'circle-distance-unit-' + lang">{{ 'admin-warning.creation.parts.information.radiusDistanceUnit' | translate }}</label>
      <p-dropdown [inputId]="'circle-distance-unit-' + lang" [options]="availableDistanceUnits"
                  [(ngModel)]="selectedDistanceUnitsByLang[index].selectedDistanceUnit"
                  ngDefaultControl>
                  <ng-template pTemplate="item" let-item>
                  {{item.name | translate}}
                  </ng-template>
                  <ng-template pTemplate="selectedItem" let-item>
                  {{item.name | translate}}
                  </ng-template>
      </p-dropdown>
    </div>
    <div class="pisac-field">
      <label [attr.for]="'decimal-minute-precision-' + lang">{{ 'admin-warning.creation.parts.information.decimal-minute-precision' | translate }}</label>
      <p-dropdown [inputId]="'decimal-minute-precision-' + lang" [options]="availablePrecision"
                  [(ngModel)]="selectedPrecisionByLang[index].selectedPrecision"
                  ngDefaultControl>
      </p-dropdown>
    </div>
    <!-- insert geometries to clip board -->
    <button pButton class="button-add-geometries p-button-outlined" type="button" icon="pi pi-plus"
            (click)="addGeometryToTextContent(lang)" translate [label]="'georegulation.information.add-geometry' | translate"
            [title]="'georegulation.information.add-geometry' | translate"
    ></button>
  </div>

  <div class="clipboard-block">
    <div class="clipboard-header">
      <span class="lang-label">{{lang | uppercase}}</span>
      <button class="btn-copy-to-clipboard p-button-text p-button-rounded" pButton type="button" icon="far fa-copy"
              (click)="copyGeometriesLangToClipBoard($event, lang)"
              [pTooltip]="('georegulation.information.btn-copy-to-clipboard' | translate) + lang"
              tooltipPosition="left"
      ></button>
    </div>
    <textarea pInputTextarea class="readonly" [rows]="6" [(ngModel)]="informationsClipBoard[lang]" [readonly]="true"></textarea>
  </div>
</div>
