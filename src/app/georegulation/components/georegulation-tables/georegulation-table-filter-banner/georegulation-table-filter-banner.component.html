<div class="banner">
  <p-dropdown [options]="services"
              [(ngModel)]="selectedService"
              (ngModelChange)="selectService()"
              [placeholder]="'filter.filter-bar.select-service' | translate"
  >
    <ng-template let-service pTemplate="selectedItem">
      {{service | translateName}}
    </ng-template>
    <ng-template let-service pTemplate="item">
      {{service | translateName}}
    </ng-template>
  </p-dropdown>
  <button pButton
          class="other-filters-button"
          [label]="'filter.filter-bar.other-filters' | translate"
          (click)="op.toggle($event)"
  ></button>
  <div class="chips-container">
    <p-chip *ngFor="let chipText of quickFilterAccessChips"
            [label]="(chipText.translateParams?.count === 1 && chipText.translateKeyOne ? chipText.translateKeyOne : chipText.translateKey)
                      | translate:chipText.translateParams"
            (onRemove)="removeQuickFilterChip(chipText.key)"
            [removable]="true"
    ></p-chip>
  </div>
</div>

<p-overlayPanel #op
                class="overlay-panel"
                [showCloseIcon]="true"
                [autoZIndex]="true"
                [dismissable]="false"
                [style]="{width: '40%'}"
>
  <ng-template pTemplate>
    <ng-container *ngTemplateOutlet="advancedFilterComponent"></ng-container>
  </ng-template>
</p-overlayPanel>
