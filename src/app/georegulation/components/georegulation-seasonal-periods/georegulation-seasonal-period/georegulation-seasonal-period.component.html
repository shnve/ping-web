<!-- PISAC (F5.3.2): «Del [día] [mes] al [día] [mes]» en una fila que se adapta al ancho -->
<div class="seasonal-period-row">
  <span class="seasonal-period-word">{{'georegulation.seasonal-periods-from' | translate }}</span>
  <p-dropdown [options]="availableDays"
              [(ngModel)]="dayStart"
              (ngModelChange)="dayStartChanged()"
              [disabled]="disabled"
              styleClass="seasonal-day"
              [placeholder]="'georegulation.seasonal-periods-select-day' | translate" ngDefaultControl>
  </p-dropdown>
  <p-dropdown [options]="availableMonths"
              [(ngModel)]="monthStart"
              (ngModelChange)="monthStartChanged()"
              [disabled]="disabled"
              styleClass="seasonal-month"
              [placeholder]="'georegulation.seasonal-periods-select-month' | translate" ngDefaultControl>
    <ng-template pTemplate="item" let-month >
      <div>{{ month.label | translate}}</div>
    </ng-template>
    <ng-template pTemplate="selectedItem" let-month >
      <div>{{ month.label | translate}}</div>
    </ng-template>
  </p-dropdown>
  <span class="seasonal-period-word">{{'georegulation.seasonal-periods-to' | translate }}</span>
  <p-dropdown [options]="availableDays"
              [(ngModel)]="dayEnd"
              (ngModelChange)="dayEndChanged()"
              [disabled]="disabled"
              styleClass="seasonal-day"
              [placeholder]="'georegulation.seasonal-periods-select-day' | translate" ngDefaultControl>
  </p-dropdown>
  <p-dropdown [options]="availableMonths"
              [(ngModel)]="monthEnd"
              (ngModelChange)="monthEndChanged()"
              [disabled]="disabled"
              styleClass="seasonal-month"
              [placeholder]="'georegulation.seasonal-periods-select-month' | translate" ngDefaultControl>
    <ng-template pTemplate="item" let-month >
      <div>{{ month.label | translate}}</div>
    </ng-template>
    <ng-template pTemplate="selectedItem" let-month >
      <div>{{ month.label | translate}}</div>
    </ng-template>
  </p-dropdown>
</div>
<small *ngIf="isInvalid" class="p-error field-validation-error" translate>georegulation.seasonal-periods-invalid</small>
