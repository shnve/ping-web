<div class="banner">
  <div *ngFor="let georegulationDisplayTypeOption of georegulationDisplayTypeOptions" class="p-field-checkbox">
    <p-checkbox (onChange)="displayTypeOptionClicked($event)"
      name="georegulationDisplayTypeOption-group"
      [value]="georegulationDisplayTypeOption"
      [(ngModel)]="selectedGeoregulationDisplayTypes"
      [inputId]="georegulationDisplayTypeOption.code">
    </p-checkbox>
    <label [for]="georegulationDisplayTypeOption.code">{{georegulationDisplayTypeOption.text}}</label>
  </div>

  <button pButton
          class="other-filters-button"
          [label]="'filter.filter-bar.other-filters' | translate"
          (click)="op.toggle($event)"
  ></button>
  <div class="chips-container">
    <p-chip *ngFor="let chipText of quickFilterAccessChips"
            [label]="chipText.translateKey | translate:chipText.translateParams"
            (onRemove)="removeQuickFilterChip(chipText.key)"
            [removable]="true"
    ></p-chip>
  </div>
</div>


<p-overlayPanel #op
    class="overlay-panel"
    [showCloseIcon]="true"
    [autoZIndex]="false"
    [dismissable]="false"
>
  <ng-template pTemplate>
    <georegulation-map-advanced-filter [filterState]="_filterState"></georegulation-map-advanced-filter>
  </ng-template>
</p-overlayPanel>
