<!-- PISAC (F5.4): cabecera de página clara, tabla y paginador en tarjeta, acciones de fila solo con icono. -->
<ng-container *ngIf="pageItem">
  <div class="pisac-list-page">
  <p-confirmPopup></p-confirmPopup>
  <pisac-page-header variant="light" icon="pi pi-paperclip" title="static-file.list.title">
    <button actions pButton class="add-button" *ngIf="enableCreate" routerLink="./creation" [label]="'static-file.creation.title' | translate" icon="pi pi-plus"></button>
  </pisac-page-header>
  <div class="pisac-table-card">
  <div class="pisac-table-scroll">
  <table class="administration-table">
    <thead>
    <tr>
      <th translate>static-file.list.description</th>
      <th translate>static-file.list.path</th>
      <th translate>static-file.list.filename</th>
      <th translate>static-file.list.action</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let staticFile of pageItem?.content">
      <td>{{staticFile.description}}</td>
      <td>
        <static-file [path]="staticFile.path" [display]="staticFile.path"></static-file>
      </td>
      <td>{{staticFile.attachmentFile.filename}}</td>
      <td>
        <button pButton *ngIf="enablePreview" class="p-button-sm p-button-text p-button-rounded" routerLink="./{{staticFile.id}}/details" [title]="'static-file.list.show' | translate" [attr.aria-label]="'static-file.list.show' | translate" icon="pi pi-eye"></button>
        <button pButton *ngIf="enableEdit" class="p-button-sm p-button-text p-button-rounded" routerLink="./{{staticFile.id}}/edition" [title]="'static-file.list.edit' | translate" [attr.aria-label]="'static-file.list.edit' | translate" icon="pi pi-pencil"></button>
        <button pButton *ngIf="enableEdit && !staticFile.locked" class="p-button-sm p-button-text p-button-rounded p-button-danger" (click)="confirmDelete($event, staticFile.id)" [title]="'static-file.list.delete' | translate" [attr.aria-label]="'static-file.list.delete' | translate" icon="pi pi-trash"></button>
      </td>
    </tr>
    </tbody>
  </table>
  </div>
  <app-ping-paginator
    [page]="pageItem"
    [currentSize]="this.currentSize"
    [currentPage]="this.currentPage"
    (changePage)="this.handlePageEvent($event)"
  ></app-ping-paginator>
  </div>
  </div>
</ng-container>
