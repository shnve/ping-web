<form [formGroup]="staticFileForm" class="form" (ngSubmit)="saveStaticFile()">

  <!-- description -->
  <div class="line-form p-field p-grid">
    <label for="static-file-description" class="label p-col-fixed">{{'static-file.creation.description' | translate }} *</label>
    <input id="static-file-description" type="text" formControlName="description" [ngClass]="{'is-invalid': description.errors}" required>
    <div *ngIf="(description.touched || description.dirty) && description.errors" class="invalid-feedback">
      <div *ngIf="description.errors.required">{{('errors.required' | translate:{attr: 'description'})}}</div>
    </div>
  </div>

  <!-- path -->
  <div class="line-form p-field p-grid">
    <label for="static-file-path" class="label p-col-fixed">{{'static-file.creation.path' | translate }} *</label>
    <input id="static-file-path" type="text" formControlName="path" [ngClass]="{'is-invalid': path.errors}" required>
    <div *ngIf="(path.touched || path.dirty) && path.errors" class="invalid-feedback">
      <div *ngIf="path.errors.required">{{('errors.required' | translate:{attr: 'path'})}}</div>
      <div *ngIf="path.errors.pattern">{{('errors.must-match' | translate:{attr: 'path', pattern: path.errors.pattern.requiredPattern})}}</div>
    </div>
  </div>

  <!-- attachment -->
  <div class="line-form p-field p-grid">
    <label for="static-file-attachment" class="label p-col-fixed">{{'static-file.creation.attachment' | translate }} *</label>
    <div class="attachments">
      <app-attachments id="attachments"
                        [manageManyAttachments]="false"
                        [attachmentFiles]="staticFile.attachmentFile"
                        [attachmentIds]="staticFile.attachmentId"
                        [showChooseFile]="!staticFile.attachmentId"
                        [disabled]="disabled"
                        [inputId]="'static-file-attachments'"
                        (onChange)="setAttachmentId($event)">
      </app-attachments>
    </div>
  </div>

  <button *ngIf="!disabled" pButton class="save-button" [label]="'save' | translate" type="submit" icon="pi pi-check" [disabled]="!staticFileForm.valid || !staticFile.attachmentId"></button>
  <button *ngIf="disabled" pButton [label]="'return-to-list' | translate" icon="pi pi-chevron-left" [routerLink]="staticFileListPath"></button>
  <button *ngIf="!disabled" pButton [label]="'cancel' | translate" icon="pi pi-times" [routerLink]="staticFileListPath"></button>
</form>
