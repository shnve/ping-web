<!-- PISAC (F5.3.4): formulario de expediente en una tarjeta, etiquetas arriba, rejilla de 2 columnas y barra de
     acciones inferior. No cambia la lógica: se conservan formControlName, eventos y condiciones *ngIf. -->
<div class="folder-form-page">
    <form #form (ngSubmit)="validate()" [formGroup]="folderForm">
        <pisac-page-header variant="light" icon="pi pi-folder-open"
            [title]="folderId ? 'folder-modification.title' : 'folder-creation.title'">
        </pisac-page-header>

        <pisac-card title="folder-creation.sections.general" icon="pi pi-info-circle">
            <div class="pisac-form-grid--2">
                <!-- Area -->
                <div class="pisac-field pisac-field--required">
                    <label for="maritime-service-areas" translate>folder-creation.area</label>
                    <p-dropdown *ngIf="areas$ | async as areas" id="maritime-service-areas" inputId="maritime-service-areas" formControlName="areas"
                        [options]="areas" [optionLabel]="displayedAreaLabel" optionValue="id"
                        [placeholder]="'folder-creation.ph-area' | translate" [showClear]="true"
                        (ngModelChange)="changeSelectedArea($event)">
                    </p-dropdown>
                    <small class="p-error" *ngIf="(areas.invalid && submitted) || (areas.dirty && areas.invalid)"
                        translate>folder-creation.errors.areas-invalid</small>
                </div>

                <!-- Localities -->
                <div class="pisac-field">
                    <label for="localities" translate>folder-creation.locality</label>
                    <p-dropdown id="localities" inputId="localities" *ngIf="subArea$ | async as subArea"
                        formControlName="locality"
                        [options]="subArea"
                        [optionLabel]="displayedAreaLabel"
                        optionValue="id"
                        [showClear]="locality.value?.length"
                        [placeholder]="'folder-creation.ph-locality' | translate"
                        [filterBy]="displayedAreaLabel"
                        [filter]="true">
                    </p-dropdown>
                </div>

                <!-- Concerned maritime entities -->
                <div class="pisac-field pisac-span-all">
                    <label for="concernedMaritimeEntityIds" translate>infosource.report-hazard.concerned-maritime-entities</label>
                    <p-multiSelect *ngIf="availableMaritimeEntities" inputId="concernedMaritimeEntityIds" formControlName="concernedMaritimeEntityIds"
                        [options]="availableMaritimeEntities"
                        [placeholder]="'infosource.report-hazard.concerned-maritime-entities' | translate"
                        [emptyFilterMessage]="'menu.area.dropdown.not-found' | translate" [optionLabel]="'option-label-name' | translate"
                        optionValue="id">
                    </p-multiSelect>
                </div>

                <!-- Object name -->
                <div class="pisac-field pisac-field--required pisac-span-all">
                    <label for="object" translate>folder-creation.object</label>
                    <input type="text" formControlName="object" id="object" pInputText>
                    <small class="p-error" *ngIf="(object.invalid && submitted) || (object.dirty && object.invalid)"
                        translate>folder-creation.errors.object-invalid</small>
                </div>

                <!-- review date -->
                <div class="pisac-field">
                    <label for="reviewDate" translate>folder-creation.review-date</label>
                    <p-calendar [dateFormat]="dateFormat" dataType="string" formControlName="reviewDate" [showIcon]="true"
                        id="reviewDate" inputId="reviewDate" ngDefaultControl [appendTo]="'body'">
                    </p-calendar>
                </div>

                <!--   Status   -->
                <div class="pisac-field" *ngIf="folderId">
                    <label for="status" translate>folder-creation.status</label>
                    <p-dropdown id="status" inputId="status"
                                formControlName="status"
                                [options]="availableStatus"
                                optionLabel="value"
                                optionValue="key"
                                [placeholder]="'folder-creation.ph-status' | translate">
                    </p-dropdown>
                </div>

                <!-- Comment -->
                <div class="pisac-field pisac-span-all">
                    <label for="comment" translate>folder-creation.comment</label>
                    <textarea formControlName="comment" id="comment" pInputTextarea rows="6">
                    </textarea>
                </div>
            </div>
        </pisac-card>

        <!-- Barra de acciones: Cancelar a la izquierda, Crear/Actualizar (primario) a la derecha -->
        <div class="pisac-action-bar">
            <p-confirmPopup></p-confirmPopup>
            <button pButton type="button" class="p-button-outlined p-button-danger" icon="pi pi-times"
                [title]="'detail.cancel' | translate" [label]="'detail.cancel' | translate"
                (click)="confirmCancelActionOnFolder($event)"></button>
            <div class="pisac-action-bar__info"></div>
            <div class="pisac-action-bar__group">
                <button pButton type="submit" icon="pi pi-save"
                    [label]="(folderId ? 'folder-creation.update-folder': 'folder-creation.create-folder') | translate"></button>
            </div>
        </div>
    </form>
</div>
