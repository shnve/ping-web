<!-- PISAC (F5.3.5): estado del usuario como fila de acción (selector a la izquierda, Guardar a la derecha).
     Misma lógica y confirmación. -->
<form [formGroup]="form" *ngIf="form" class="pisac-action-row">
  <div class="pisac-field pisac-action-row__text">
    <label for="user-status" translate>account.creation.information.user-status</label>
    <p-selectButton id="user-status"
                    [options]="booleanOptions"
                    ngDefaultControl
                    [unselectable]="true"
                    formControlName="userStatus">
      <ng-template let-item pTemplate>
        <span class="p-selectButton-label">{{'account.creation.information.user-status.' + item | translate}}</span>
      </ng-template>
    </p-selectButton>
  </div>
  <div class="pisac-action-row__actions">
    <p-confirmPopup></p-confirmPopup>
    <p-button type="button" icon="pi pi-save" (onClick)="confirmSave($event)" [label]="'save' | translate" [disabled]="userStatus.value === this.enabled" ngDefaultControl></p-button>
  </div>
</form>
