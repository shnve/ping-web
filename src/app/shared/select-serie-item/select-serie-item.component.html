<div *ngIf="serie">
    <div *ngIf="currentLang === 'es'; else otherLanguage">{{serie.name}} ({{'serie-type.' + serie.type | translate}})</div>
    <ng-template #otherLanguage>
        <div>{{serie.internationalName ?? serie.name}} ({{'serie-type.' + serie.type | translate}})</div>
    </ng-template>
</div>
