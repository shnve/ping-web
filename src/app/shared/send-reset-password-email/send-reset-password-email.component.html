<!-- PISAC (F5.3.5): fila de acción (descripción a la izquierda, botón a la derecha). Misma lógica. -->
<form (ngSubmit)="resetPassword()" class="pisac-action-row">
  <div class="pisac-action-row__text reset-password-description" [innerHTML]="'account.reset-password.description' | translate"></div>
  <div class="pisac-action-row__actions">
    <p-button type="submit" icon="pi pi-key" styleClass="p-button-outlined" [label]="'account.reset-password.submit' | translate" ngDefaultControl></p-button>
  </div>
</form>
