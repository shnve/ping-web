<div class="banner">
  <p-dropdown [options]="series | orderBy: ('option-label-name' | translate)"
              [(ngModel)]="serieSelected"
              (ngModelChange)="selectSerie()"
              [placeholder]="'filter.filter-bar.select-serie' | translate"
  >
  <ng-template pTemplate="selectedItem">
    <app-select-serie-item [serie]="serieSelected"></app-select-serie-item>
  </ng-template>
  <ng-template let-serie pTemplate="item">
    <app-select-serie-item [serie]="serie"></app-select-serie-item>
  </ng-template>
  </p-dropdown>
  <button pButton
          class="other-filters-button"
          [label]="'filter.filter-bar.other-filters' | translate"
          (click)="op.toggle($event)"
          [disabled]="!serieSelected"
  ></button>
  <div class="chips-container">
    <p-chip *ngFor="let chipText of quickFilterAccessChips"
            [label]="(chipText.translateParams?.count === 1 && chipText.translateKeyOne ? chipText.translateKeyOne : chipText.translateKey)
                      | translate:chipText.translateParams"
            (onRemove)="removeQuickFilterChip(chipText.key)"
            [removable]="true"
    ></p-chip>
  </div>
  <div *ngIf="listDetailSwitcher" class="row-right">
    <shared-select-button [options]="tableViewOptions" [(ngModel)]="tableView" (ngModelChange)="changeTableView()"
    ></shared-select-button>
  </div>
</div>


<p-overlayPanel #op
                class="overlay-panel"
                [showCloseIcon]="true"
                [autoZIndex]="true"
                [dismissable]="false"
>
  <ng-template pTemplate>
    <ng-container *ngTemplateOutlet="advancedFilterComponent"></ng-container>
  </ng-template>
</p-overlayPanel>
