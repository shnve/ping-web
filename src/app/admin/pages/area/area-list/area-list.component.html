<!-- PISAC (F5.4): cabecera de página clara, tabla y paginador en tarjeta, acciones de fila solo con icono. -->
<ng-container *ngIf="pageItem">
<div class="pisac-list-page">
<pisac-page-header variant="light" icon="pi pi-globe" title="area-list.title.list">
  <button actions pButton class="add-button" *ngIf="canCreateModel" routerLink="./ajouter" [label]="'area-list.add-area' | translate" icon="pi pi-plus"></button>
</pisac-page-header>
<div class="pisac-table-card">
<div class="pisac-table-scroll">
<table class="administration-table">
  <thead>
    <tr>
      <th translate>area-list.table.urn</th>
      <th translate>area-list.table.name</th>
      <th translate>area-list.table.country</th>
      <th translate>area-list.table.action </th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let area of pageItem?.content">
      <td>{{area.urn}}</td>
      <td>{{area.name}}</td>
      <td>{{area.country}}</td>
      <td>
        <button pButton *ngIf="canPreviewModel" class="p-button-sm p-button-text p-button-rounded preview-button" routerLink="./{{area.id}}/details" [title]="'area-list.table.show' | translate" [attr.aria-label]="'area-list.table.show' | translate" icon="pi pi-eye"></button>
        <button pButton *ngIf="canEditModel" class="p-button-sm p-button-text p-button-rounded edit-button" routerLink="./{{area.id}}/edition" [title]="'area-list.table.edit' | translate" [attr.aria-label]="'area-list.table.edit' | translate" icon="pi pi-pencil"></button>
      </td>
    </tr>
  </tbody>
</table>
</div>
<app-ping-paginator
  [page]="pageItem"
  [currentSize]="this.currentSize"
  [currentPage]="this.currentPage"
  (changePage)="this.handlePageEvent($event)"
  ></app-ping-paginator>
</div>
</div>
</ng-container>
