<!-- PISAC (F5.4): cabecera de página clara, tabla y paginador en tarjeta, acciones de fila solo con icono. -->
<ng-container *ngIf="pageItem">
<div class="pisac-list-page">
<pisac-page-header variant="light" icon="pi pi-id-card" title="pro-user-list.title.list">
  <button actions pButton class="add-button" *ngIf="canCreate" routerLink="./ajouter" [label]="'pro-user-list.add' | translate" icon="pi pi-plus"></button>
</pisac-page-header>
<div class="pisac-table-card">
<div class="pisac-table-scroll">
<table class="administration-table">
  <thead>
  <tr>
    <th>
      <label translate>user-list.table.lastname</label>
      <br/>
      <input pInputText class="text-filter" [placeholder]="'user-list.table.filter.lastname' | translate" [(ngModel)]="filteredLastname"
        (ngModelChange)="onFilterChange()" type="text" />
    </th>
    <th>
      <label translate>user-list.table.firstName</label>
      <br/>
      <input pInputText class="text-filter" [placeholder]="'user-list.table.filter.firstname' | translate" [(ngModel)]="filteredFirstname"
        (ngModelChange)="onFilterChange()" type="text" />
    </th>
    <th>
      <label translate>user-list.table.mail</label>
      <br/>
      <input pInputText class="text-filter" [placeholder]="'user-list.table.filter.email' | translate" [(ngModel)]="filteredEmail"
        (ngModelChange)="onFilterChange()" type="text" />
    </th>
    <th translate>user-list.table.status</th>
    <th translate>user-list.table.action</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let user of pageItem?.content">
    <td>{{user.lastname}}</td>
    <td>{{user.firstname}}</td>
    <td>{{user.email}}</td>
    <td>{{user.status}}</td>
    <td>
      <button pButton *ngIf="canPreviewModel" class="p-button-sm p-button-text p-button-rounded" routerLink="./{{user.id}}/details" [title]="'user-list.table.show' | translate" [attr.aria-label]="'user-list.table.show' | translate" icon="pi pi-eye"></button>
      <button pButton *ngIf="canEdit(user.id)" class="p-button-sm p-button-text p-button-rounded" routerLink="./{{user.id}}/edition" [title]="'user-list.table.edit' | translate" [attr.aria-label]="'user-list.table.edit' | translate" icon="pi pi-pencil"></button>
    </td>
  </tr>
  </tbody>
</table>
</div>
<app-ping-paginator
  [page]="pageItem"
  [currentSize]="this.currentSize"
  [currentPage]="this.currentPage"
  (changePage)="this.handlePageEvent($event)"
></app-ping-paginator>
</div>
</div>
</ng-container>
