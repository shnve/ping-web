<!-- PISAC (F5.4): cabecera, formulario y, debajo, usuarios asignados y entidades marítimas vinculadas y observadas
     en tarjetas (antes, dos columnas con p-card y saltos de línea). Mismas condiciones y datos. -->
<div class="pisac-form-page">
  <pisac-page-header variant="light" icon="pi pi-sitemap"
    [title]="disabled ? 'maritime-services-list.title.show' : 'maritime-services-list.title.edit'"></pisac-page-header>

  <app-maritime-service-form *ngIf="maritimeService" [maritimeService]="maritimeService" [disabled]="disabled"></app-maritime-service-form>

  <app-service-users-assign *ngIf="canDisplayRoleAssign" [serviceId]="serviceId" [disabled]="disabled"></app-service-users-assign>

  <div class="pisac-form-grid--2 linked-entities">
    <pisac-card title="maritime-services-list.title.linkedMaritimeEntities" icon="pi pi-link">
      <ul *ngIf="maritimeService?.maritimeEntities?.length; else noLinked" class="entity-list">
        <li *ngFor="let maritimeEntity of maritimeService?.maritimeEntities">{{maritimeEntity}}</li>
      </ul>
      <ng-template #noLinked>
        <pisac-empty-state [compact]="true" icon="pi pi-link" message="maritime-services-list.noLinkWithMaritimeEntity"></pisac-empty-state>
      </ng-template>
    </pisac-card>
    <pisac-card title="maritime-services-list.title.observedMaritimeEntities" icon="pi pi-eye">
      <ul *ngIf="maritimeService?.observedMaritimeEntities?.length; else noObserved" class="entity-list">
        <li *ngFor="let maritimeEntity of maritimeService?.observedMaritimeEntities">{{maritimeEntity}}</li>
      </ul>
      <ng-template #noObserved>
        <pisac-empty-state [compact]="true" icon="pi pi-eye" message="maritime-services-list.noMaritimeEntityObserved"></pisac-empty-state>
      </ng-template>
    </pisac-card>
  </div>
</div>
