<!-- PISAC (F5.4): subzona en tarjetas (datos generales, ubicación con el mapa) con etiquetas arriba, rejilla de
     2 columnas y barra de acciones. No cambia la lógica: se conservan formControlName, condiciones, id de los
     campos y las clases que usan las pruebas (form, save-button). -->
<form [formGroup]="subAreaForm" class="form sub-area-form" (ngSubmit)="saveSubArea()">
  <!-- Datos generales -->
  <pisac-card title="admin-form.sections.general" icon="pi pi-tag">
    <div class="pisac-form-grid--2">
      <div class="pisac-field">
        <label for="sub-area-urn" translate>area.urn</label>
        <input id="sub-area-urn" type="text" formControlName="urn" pInputText placeholder="urn:mrn:s124:subarea:...">
      </div>
      <div class="pisac-field">
        <label for="sub-area-technical-identifier" translate>area.technical-identifier</label>
        <input id="sub-area-technical-identifier" type="text" formControlName="technicalIdentifier" pInputText>
      </div>
      <div class="pisac-field pisac-field--required">
        <label for="sub-area-name" translate>area.name</label>
        <input id="sub-area-name" type="text" formControlName="name" pInputText required>
      </div>
      <div class="pisac-field">
        <label for="sub-area-iname" translate>area.internationalName</label>
        <input id="sub-area-iname" type="text" formControlName="internationalName" pInputText>
      </div>
    </div>
  </pisac-card>

  <!-- Ubicación -->
  <pisac-card title="admin-form.sections.location" icon="pi pi-map">
    <div class="pisac-form-grid--2">
      <div class="pisac-field">
        <label for="maritime-entity-areas" translate>maritime-entity.areas</label>
        <p-dropdown id="maritime-entity-areas" *ngIf="areas$ | async as areas"
                    formControlName="areaId"
                    [options]="areas | orderBy: (displayedLabel)"
                    [optionLabel]="displayedLabel"
                    optionValue="id"
                    [placeholder]="'maritime-entity.all-areas' | translate"
                    showClear="true">
        </p-dropdown>
      </div>
      <div class="pisac-field pisac-span-all">
        <label for="sub-area-children" translate>subArea.subAreas</label>
        <p-multiSelect *ngIf="subAreas$ | async as subAreas"
                       id="sub-area-children"
                       formControlName="subAreas"
                       [options]="subAreas | orderBy: (displayedLabel)"
                       [optionLabel]="displayedLabel"
                       [maxSelectedLabels]="subAreas.length"
                       optionValue="id"
                       display="chip"
                       [placeholder]="'subArea.select-child' | translate">
        </p-multiSelect>
      </div>
      <div class="pisac-span-all part-map-container">
        <app-view-geometry #viewGeometry [isEditionMode]="!disabled" [geometry]="subArea?.geom"></app-view-geometry>
      </div>
    </div>
  </pisac-card>

  <div class="pisac-action-bar pisac-action-bar--detached">
    <div class="pisac-action-bar__info">
      <span *ngIf="!disabled" translate>admin-form.required-note</span>
    </div>
    <div class="pisac-action-bar__group">
      <button *ngIf="disabled" pButton type="button" class="p-button-outlined" [label]="'return-to-list' | translate"
        icon="pi pi-chevron-left" routerLink="/administration/sous-zones"></button>
      <button *ngIf="!disabled" pButton type="button" class="p-button-outlined" [label]="'cancel' | translate"
        icon="pi pi-times" routerLink="/administration/sous-zones"></button>
      <button *ngIf="!disabled" pButton class="save-button" [label]="'save' | translate" type="submit" icon="pi pi-check"
        [disabled]="!subAreaForm.valid"></button>
    </div>
  </div>
</form>
