<!-- PISAC (F5.4): cabecera de página clara, tabla y paginador en tarjeta, acciones de fila solo con icono. -->
<ng-container *ngIf="pageItem">
<div class="pisac-list-page">
<pisac-page-header variant="light" icon="pi pi-list" title="serie-list.title.list">
  <button actions pButton class="add-button" *ngIf="canCreateModel" routerLink="./ajouter" [label]="'serie-list.add-serie' | translate" icon="pi pi-plus"></button>
</pisac-page-header>
<div class="pisac-table-card">
<div class="pisac-table-scroll">
<table class="administration-table">
  <thead>
  <tr>
    <th translate>serie-list.table.urn</th>
    <th translate>serie-list.table.name</th>
    <th translate>serie-list.table.service</th>
    <th translate>serie-list.table.action </th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let serie of pageItem?.content">
    <td>{{serie.urn}}</td>
    <td>{{serie.name}}</td>
    <td>{{serie.maritimeService?.name}}</td>
    <td>
      <button pButton *ngIf="canPreviewModel" class="p-button-sm p-button-text p-button-rounded preview-button" routerLink="./{{serie.id}}/details" [title]="'serie-list.table.show' | translate" [attr.aria-label]="'serie-list.table.show' | translate" icon="pi pi-eye"></button>
      <button pButton *ngIf="canEditModel" class="p-button-sm p-button-text p-button-rounded edit-button" routerLink="./{{serie.id}}/edition" [title]="'serie-list.table.edit' | translate" [attr.aria-label]="'serie-list.table.edit' | translate" icon="pi pi-pencil"></button>
    </td>
  </tr>
  </tbody>
</table>
</div>
<app-ping-paginator
  [page]="pageItem"
  [currentSize]="this.currentSize"
  [currentPage]="this.currentPage"
  (changePage)="this.handlePageEvent($event)"
></app-ping-paginator>
</div>
</div>
</ng-container>
