<shared-select-button class="select-geom-type"
  [options]="selectGeomAreaOptions"
  [(ngModel)]="selectedGeomAreaOption"
  (ngModelChange)="changeGeomArea()"
></shared-select-button>
<sig-map #map class="map"
        [extent]="selectedAreaExtent"
        [modulesOptions]="modulesOptions"
        [enableKmlImport]="true"
        [enableLayersShowHide]="true"
        [parentLayers]="false"
        [serieName]="serieName"
        [serieId]="serieId"
        [getDetailWarnings]="false"
        [showLayers]="true"
        [showZoneX]="true"
        [shouldShowSubAreas]="true"
        [showWarnings]="true"
        [popover]="true"
        [kmlImportCallback]="onImportKmlClick.bind(this)"
        (onLoad)="mapLoaded()"
        [enableLayerMaritimesEntitiesManagedOrObservedByService]="true"
        [shouldShowRasterMarineWithAdditionalLayerForWestAfrica]="true"
></sig-map>
<input type="file" id="kmlFile" [accept]="kmlImportAccept" style="display:none">
