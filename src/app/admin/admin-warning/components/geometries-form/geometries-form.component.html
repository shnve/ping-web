<shared-select-button class="select-geom-type" [options]="selectGeomAreaOptions" [(ngModel)]="selectedGeomAreaOption"
  (ngModelChange)="changeGeomArea()"></shared-select-button>
<sig-map #map class="map" [extent]="selectedAreaExtent" [modulesOptions]="modulesOptions" [enableKmlImport]="true"
  [geometriesLayer]="selectedGeomAreaOption === 'affectedAreas' ? affectedAreasLayer : geometriesLayer" [disabled]="false"
  [enableLayersShowHide]="true" [parentLayers]="false" [serieName]="serieName" [serieId]="serieId"
  [getDetailWarnings]="false" [showLayers]="true" [showZoneX]="true" [shouldShowSubAreas]="true" [showWarnings]="true"
  [popover]="true" [kmlImportCallback]="onImportKmlClick.bind(this)" (onLoad)="mapLoaded()"
  [enableLayerMaritimesEntitiesManagedOrObservedByService]="true"
  [shouldShowRasterMarineWithAdditionalLayerForWestAfrica]="true"></sig-map>

<!-- PISAC (F5.3): panel de coordenadas manuales sin estilos en línea; campos con pInputText y botones del tema -->
<div *ngIf="isEditionMode" class="manual-coords-panel pisac-panel-muted">
  <h3 class="pisac-subsection-title"><i class="pi pi-map-marker" aria-hidden="true"></i>{{ 'carto.manual-coords.title' | translate }}</h3>

  <div class="manual-coords-row">

    <div class="pisac-field manual-coords-field">
      <label for="manual-coords-lat">{{ 'COORDINATES.LATITUDE' | translate }}</label>
      <input type="text" id="manual-coords-lat" pInputText
             [(ngModel)]="latText"
             (ngModelChange)="latText = $event.toUpperCase()"
             [ngModelOptions]="{standalone: true}"
             class="form-control"
             placeholder="Ej: 49-59.61N"
             pattern="^(0[0-9]|[1-8][0-9]|90)-(0[0-9]|[1-5][0-9])(\.\d+)?[NS]$"
             #latInput="ngModel">
      <small *ngIf="latInput.invalid && latInput.dirty" class="p-error">Formato inválido</small>
    </div>

    <div class="pisac-field manual-coords-field">
      <label for="manual-coords-lon">{{ 'COORDINATES.LONGITUDE' | translate }}</label>
      <input type="text" id="manual-coords-lon" pInputText
             [(ngModel)]="lonText"
             (ngModelChange)="lonText = $event.toUpperCase()"
             [ngModelOptions]="{standalone: true}"
             class="form-control"
             placeholder="Ej: 001-13.50E"
             pattern="^(0[0-9]{2}|1[0-7][0-9]|180)-(0[0-9]|[1-5][0-9])(\.\d+)?[EW]$"
             #lonInput="ngModel">
      <small *ngIf="lonInput.invalid && lonInput.dirty" class="p-error">Formato inválido</small>
    </div>

    <div class="manual-coords-actions">
      <button pButton type="button" icon="pi pi-map-marker" (click)="addPointToMap()"
              [label]="'carto.manual-coords.add-vertex' | translate"></button>
      <button pButton type="button" icon="pi pi-trash" class="p-button-outlined p-button-danger" (click)="clearManualCoords()"
              [label]="'carto.manual-coords.clear' | translate"></button>
    </div>

  </div>
</div>
<input type="file" id="kmlFile" [accept]="kmlImportAccept" style="display:none">
