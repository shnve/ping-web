
<!-- PISAC (F5.3): campos de la parte con etiqueta arriba y subtítulos de sección -->
<form [formGroup]="form" class="feature-part-form">
  <div class="formgroup-inline" *ngIf="optionsWarningTypeDetails?.length > 0">
    <div class="pisac-field pisac-field--required div-details" [ngClass]="{'error': !validFeaturePart}">
      <label for="typeDetails" translate>admin-warning.creation.labels.warning-type-details</label>
      <p-multiSelect inputId="typeDetails"
                  formControlName="typeDetails"
                  [options]="optionsWarningTypeDetails"
                  [placeholder]="'admin-warning.creation.labels.select-type-details' | translate"
                  [emptyFilterMessage]="'menu.area.dropdown.not-found' | translate"
                  [emptyMessage]="'menu.area.dropdown.not-found' | translate"
                  optionLabel="value"
                  optionValue="key"
                  [group]="grouped"
      >
        <ng-template *ngIf="grouped" let-group pTemplate="group">
          <div><span>{{group.label}}</span></div>
        </ng-template>
        <ng-template let-item pTemplate="item">
            <div><span>{{item.value}}</span></div>
        </ng-template>
      </p-multiSelect>
    </div>
  </div>
  <div class="date-ranges">
    <h3 class="pisac-subsection-title"><i class="pi pi-calendar" aria-hidden="true"></i>{{'admin-warning.creation.labels.date-ranges' | translate}}</h3>
    <shared-input-date-ranges [enableTimezone]="true" formControlName="dateRanges"></shared-input-date-ranges>
  </div>
  <div class="input-information">
    <h3 class="pisac-subsection-title information-label"><i class="pi pi-align-left" aria-hidden="true"></i><span translate>admin-warning.creation.labels.information</span></h3>
    <aw-input-information [anInformation]="anInformation" [geometries]="geometries"
                          [affectedAreas]="affectedAreas"
                          [selectedAreas]="selectedAreas" [selectedLocalities]="selectedLocalities"
                          [typeDetails]="featurePart?.typeDetails" [validFeaturePart]="validFeaturePart"
                          [partIndex]="partIndex" [isBathy]="isBathy" formControlName="information">
    </aw-input-information>
  </div>
</form>
