<!-- PISAC (F5.3): etiqueta arriba, selector + botón en línea y localidades como chips -->
<div class="pisac-field settings">
  <label class="locality-label" for="localities" translate>admin-warning.creation.labels.lbl-localities</label>
  <div class="pisac-input-group">
    <p-dropdown id="localities"
                class="localities-elements"
                [options]="area?.subAreas | orderByImpure: ('option-label-name' | translate)"
                [optionLabel]="'option-label-name' | translate"
                [placeholder]="'admin-warning.creation.labels.ph-localities' | translate"
                [ngModelOptions]="{standalone: true}"
                [(ngModel)]="chosenLocality"
                [disabled]="isPublished"
                [filter]="true"
                [filterBy]="'option-label-name' | translate"
                (onChange)="onAddLocality(area.id)"
                ngDefaultControl
    >
    </p-dropdown>
    <p-button type="button" class="btn-save-locality" icon="pi pi-plus" iconPos="center"
              styleClass="p-button-outlined"
              (onClick)="showSaveLocalityModalDialog()"
              [title]="'admin-warning.creation.labels.title-btn-save-locality' | translate"
              [disabled]="isPublished"
    ></p-button>
  </div>
  <p-dialog [header]="'admin-warning.creation.labels.title-btn-save-locality' | translate"
            [(visible)]="displayModal" [modal]="true" [style]="{width: '50vw'}" [breakpoints]="{'768px': '95vw'}" [baseZIndex]="10000"
            [draggable]="false" [resizable]="false">
    <div class="pisac-field pisac-field--required">
      <label class="lbl-new-locality-name" for="new-locality-name">{{'admin-warning.creation.labels.header-add-locality' | translate}}</label>
      <input id="new-locality-name" type="text"
             class="input-new-locality-name"
             [(ngModel)]="newLocalityName"
             [ngModelOptions]="{standalone: true}"
             pInputText>
    </div>
    <div class="pisac-field">
      <label class="lbl-new-locality-name" for="new-locality-international-name" translate>admin-warning.creation.labels.header-add-locality-international</label>
      <input id="new-locality-international-name" type="text"
             class="input-new-locality-name"
             [(ngModel)]="newLocalityInternationalName"
             [ngModelOptions]="{standalone: true}"
             pInputText>
    </div>
    <ng-template pTemplate="footer">
      <p-button type="button" (click)="displayModal=false" [label]="'cancel' | translate" [title]="'cancel' | translate"
                styleClass="p-button-outlined p-button-secondary"></p-button>
      <p-button type="button" (click)="onSaveLocality(area.id)" [label]="'save' | translate" [title]="'save' | translate"></p-button>
    </ng-template>
  </p-dialog>
</div>

<ul class="locality-chips" *ngIf="checkedLocalities?.length">
  <li class="locality-chip" *ngFor="let locality of checkedLocalities | orderByImpure: 'position'">
    <span class="locality-name">{{locality.name}}</span>
    <p-button type="button" class="btn-remove-locality" icon="pi pi-times" iconPos="center" [ngClass]="{'readonly-mode': isPublished}"
              styleClass="p-button-text p-button-rounded"
              (click)="onRemoveLocality(area.id, locality.name)" [disabled]="isPublished" [title]="'remove' | translate"></p-button>
  </li>
</ul>
