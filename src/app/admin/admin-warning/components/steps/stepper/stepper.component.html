<div class="card-customed pisac-stepper">
    <div class="header" *ngIf="warning.status !== listWarningStatus.NOT_SAVED">
        <span class="warning-number">{{warning.prerequisites | formatWarningNumber:true}}</span>
        <span class="warning-status">{{('enum.warning-status.' + (warning.status | lowercase)) | translate}}</span>
    </div>
    <ol class="md-stepper-horizontal">
        <li class="md-step" *ngFor="let step of steps; let i=index"
            [ngClass]="{'active': currentStep === step.routerLink, 'done': i < currentStepIndex }">
            <button class="btn" [ngClass]="{'btn-active': currentStep === step.routerLink }" type="submit"
                    [attr.aria-current]="currentStep === step.routerLink ? 'step' : null"
                    [attr.aria-label]="(i + 1) + '. ' + step.label"
                    (click)="moveToStep(step.routerLink)">
                <span class="md-step-number">{{i+1}}</span>
            </button>
            <div class="md-step-title" [ngClass]="{'md-step-title-active': currentStep === step.routerLink }">{{step.label}}</div>
        </li>
    </ol>
</div>
