<div class="p-fluid pisac-form-grid--2">
  <div *ngIf="isNoticeOrNoticeTP" class="pisac-field">
    <label for="replacedWarnings" translate>admin-warning.creation.labels.replaced-warnings</label>
      <p-multiSelect [(ngModel)]="selectedReplaceableWarnings" [disabled]="isPublishedWarning || isWarningModel"
        [options]="replaceableWarnings | orderBy: 'warningNumber'" [showToggleAll]="false" id="replacedWarnings" optionLabel="warningNumber" [maxSelectedLabels]="replaceableWarnings?.length"
        optionValue="id"></p-multiSelect>
  </div>
  <div class="pisac-field">
    <label for="referencedWarnings" translate>admin-warning.creation.labels.referenced-warnings</label>
      <p-multiSelect [(ngModel)]="selectedReferenceableWarnings" [options]="referenceableWarnings | orderBy: 'warningNumber'"
        [disabled]="isWarningModel" [showToggleAll]="false" id="referencedWarnings" optionLabel="warningNumber" [maxSelectedLabels]="referenceableWarnings?.length"
        optionValue="id" [virtualScroll]="true" [virtualScrollItemSize]="38"></p-multiSelect>
  </div>
  <div class="pisac-field">
    <label for="infosources" translate>admin-warning.creation.labels.linked-infosources</label>
      <p-multiSelect [(ngModel)]="selectedInfosources" [disabled]="isWarningModel" [options]="availableInfosources | orderBy: 'number'" [maxSelectedLabels]="availableInfosources?.length"
        [showToggleAll]="false" id="infosources" optionLabel="number" optionValue="id"></p-multiSelect>
  </div>
  <div class="pisac-field">
    <label for="maritimeEntities" translate>admin-warning.creation.labels.linked-entities</label>
      <p-multiSelect [(ngModel)]="selectedEntities" [disabled]="isWarningModel" [options]="availableEntities | orderBy: ('option-label-name' | translate)" [maxSelectedLabels]="availableEntities?.length"
        [showToggleAll]="false" id="maritimeEntities" [optionLabel]="'option-label-name' | translate" optionValue="id">
      </p-multiSelect>
  </div>
  <div class="pisac-field">
    <label for="georegulations" translate>admin-warning.creation.labels.linked-georegulations</label>
      <p-multiSelect [(ngModel)]="selectedGeoregulations" [disabled]="isWarningModel" [options]="availableGeoregulations | orderBy: 'number'" [maxSelectedLabels]="availableGeoregulations?.length"
        [showToggleAll]="false" id="georegulations" optionLabel="number" optionValue="id"></p-multiSelect>
  </div>
</div>
