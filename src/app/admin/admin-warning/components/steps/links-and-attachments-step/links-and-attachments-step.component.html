<div>
  <div class="card">
    <aw-stepper (moveStep)="jumpToStep($event)" [currentStep]="currentStep" [warning]="anInformation">
    </aw-stepper>
  </div>
  <p-card class="step-p-card">
    <ng-template pTemplate="content">
      <!-- PISAC (F5.3): vínculos y adjuntos en tarjetas separadas -->
      <pisac-card title="admin-warning.creation.labels.references.links" icon="pi pi-link">
        <aw-links-step #linksStep></aw-links-step>
      </pisac-card>
      <pisac-card title="admin-warning.creation.labels.references.attachments" icon="pi pi-paperclip">
        <aw-attachments-step #attachmentsStep></aw-attachments-step>
      </pisac-card>
    </ng-template>
    <ng-template pTemplate="footer">
      <aw-step-save-button (savePageButton)="quickSave()"></aw-step-save-button>
      <aw-step-transition-button (nextPageButton)="nextPage()" (prevPageButton)="prevPage()" (savePageButton)="save()"
        [anInformation]="anInformation">
      </aw-step-transition-button>
    </ng-template>
  </p-card>
</div>
