<!-- PISAC (F5.3): etiqueta arriba y zona de carga a todo el ancho -->
<div class="p-fluid">
  <div class="pisac-field">
    <label for="attachments" translate>infosource.report-hazard.attachments</label>
    <app-attachments id="attachments"
                      [manageManyAttachments]="true"
                      [attachmentFiles]="this.attachments.attachmentFiles"
                      [attachmentIds]="this.attachments.attachmentIds"
                      (onChangeFiles)="setAttachmentFiles($event)"
                      >
    </app-attachments>
  </div>
</div>
