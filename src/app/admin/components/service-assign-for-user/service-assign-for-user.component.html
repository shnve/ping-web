<!-- PISAC (F5.3.5): tabla simple con los colores del sistema (antes, cabecera de color primario, sombra
     de 35 px y texto de 12 px centrado). Mismos datos y enlaces. -->
<div class="table-wrapper">
  <table class="fl-table">
    <thead>
    <tr>
      <th translate>service-user-assign.service</th>
      <th translate>service-user-assign.user-role</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let role of userRole$ | async">
      <td>
        <a routerLink="/administration/service-maritime/{{role.id}}/details" rel="noopener noreferrer" target="_blank">{{translate.currentLang === 'es' ? role.name : role.internationalName}}</a>
      </td>
      <td>{{'role.' + findLabel(role.serviceRole) | translate}}</td>
    </tr>
    </tbody>
  </table>
</div>
