<sig-map #map class="map" [modulesOptions]="modulesOptions" [parentLayers]="false" [enableKmlImport]="enableKmlImport"
    [kmlImportCallback]="onImportKmlClick.bind(this)" [geometriesLayer]="geometriesLayer"
    [disabled]="!isEditionMode"></sig-map>
<input type="file" id="kmlFile" [accept]="kmlImportAccept" hidden>

<!-- PISAC (F5.4): panel de coordenadas manuales con los estilos del sistema de diseño (antes, estilos en línea,
     azul #0055ff y rojo #dc3545 fijos). Misma lógica: ngModel, patrones y acciones sin cambios. -->
<div *ngIf="isEditionMode" class="manual-coords-panel pisac-panel-muted">
    <h3 class="pisac-subsection-title">
        <i class="pi pi-map-marker" aria-hidden="true"></i>
        {{ 'carto.manual-coords.title' | translate }}
    </h3>

    <div class="manual-coords-panel__row">
        <!-- Latitud -->
        <div class="pisac-field">
            <label for="manual-coords-lat">{{ 'COORDINATES.LATITUDE' | translate }}</label>
            <input id="manual-coords-lat" type="text" pInputText [(ngModel)]="latText" (ngModelChange)="latText = $event.toUpperCase()"
                [ngModelOptions]="{standalone: true}" placeholder="49-59.61N"
                pattern="^(0[0-9]|[1-8][0-9]|90)-(0[0-9]|[1-5][0-9])(\.\d+)?[NS]$" #latInput="ngModel">
            <small *ngIf="latInput.invalid && latInput.dirty" class="p-error" translate>carto.manual-coords.invalid-format</small>
        </div>

        <!-- Longitud -->
        <div class="pisac-field">
            <label for="manual-coords-lon">{{ 'COORDINATES.LONGITUDE' | translate }}</label>
            <input id="manual-coords-lon" type="text" pInputText [(ngModel)]="lonText" (ngModelChange)="lonText = $event.toUpperCase()"
                [ngModelOptions]="{standalone: true}" placeholder="001-13.50E"
                pattern="^(0[0-9]{2}|1[0-7][0-9]|180)-(0[0-9]|[1-5][0-9])(\.\d+)?[EW]$" #lonInput="ngModel">
            <small *ngIf="lonInput.invalid && lonInput.dirty" class="p-error" translate>carto.manual-coords.invalid-format</small>
        </div>

        <!-- Acciones -->
        <div class="manual-coords-panel__actions">
            <button pButton type="button" icon="pi pi-plus" (click)="addPointToMap()"
                [label]="'carto.manual-coords.add-vertex' | translate"></button>
            <button pButton type="button" icon="pi pi-trash" class="p-button-outlined p-button-danger"
                (click)="clearManualCoords()" [label]="'carto.manual-coords.clear' | translate"></button>
        </div>
    </div>
</div>
