<form [formGroup]="form" (ngSubmit)="send()" class="user-form">
  <div class="form-group" [ngClass]="{'error': (form.get('password')?.invalid && (form.get('password')?.dirty || form.get('password')?.touched))}">
      <span *ngIf="form.get('password')?.invalid && (form.get('password')?.dirty || form.get('password')?.touched)" class="field-validation-error">
        <span translate>account.creation.errors.password-invalid</span>
      </span>
    <div class="form-mandatory">
      <p-password formControlName="password" [placeholder]="'account.creation.credentials.password' | translate"
                  [promptLabel]="'account.creation.p-password-component.prompt-label' | translate"
                  [weakLabel]="'account.creation.p-password-component.weak-label' | translate"
                  [mediumLabel]="'account.creation.p-password-component.medium-label' | translate"
                  [strongLabel]="'account.creation.p-password-component.strong-label' | translate"
                  [toggleMask]="true" [feedback]="true" id="password" required ngDefaultControl>
        <ng-template pTemplate="footer">
          <hr />
          <ul>
            <li translate>account.creation.p-password-component.footer.tip1</li>
            <li translate>account.creation.p-password-component.footer.tip2</li>
            <li translate>account.creation.p-password-component.footer.tip3</li>
            <li translate>account.creation.p-password-component.footer.tip4</li>
          </ul>
        </ng-template>
      </p-password>
    </div>
  </div>
  <!-- submit form -->
  <p-button id="reset-submit" type="submit" [label]="'account.creation.submit' | translate"
            [disabled]="!(form.valid)" ngDefaultControl></p-button>
</form>
