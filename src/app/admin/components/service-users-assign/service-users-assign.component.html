<!-- PISAC (F5.4): usuarios de un servicio marítimo en dos tarjetas: usuarios asignados (tabla con el estilo de las
     listas) y alta de usuario (rejilla de 2 columnas, nota informativa y botón alineado a la derecha). Mismos
     datos, eventos e id; se conserva la clase `form` que usan las pruebas. -->
<pisac-card title="service-user-assign.assigned-users" icon="pi pi-users">
  <ng-container *ngIf="existingUsers$ | async as existingUsers">
    <div *ngIf="existingUsers.length; else noUser" class="pisac-table-card">
      <div class="pisac-table-scroll">
        <table class="administration-table">
          <thead>
            <tr>
              <th translate>service-user-assign.user-email</th>
              <th translate>service-user-assign.user-role</th>
              <th translate>service-user-assign.action</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of existingUsers">
              <td>{{user.email}}</td>
              <td>{{'role.' + findLabel(user.serviceRole) | translate}}</td>
              <td>
                <button pButton type="button" (click)="confirm(user)" icon="pi pi-user-minus"
                  class="p-button-sm p-button-text p-button-rounded p-button-danger"
                  [title]="'service-user-assign.extract' | translate"
                  [attr.aria-label]="('service-user-assign.extract' | translate) + ' ' + user.email"></button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <ng-template #noUser>
      <pisac-empty-state [compact]="true" icon="pi pi-users" message="service-user-assign.no-user"></pisac-empty-state>
    </ng-template>
  </ng-container>
</pisac-card>

<pisac-card title="service-user-assign.add-user-title-card" icon="pi pi-user-plus">
  <form [formGroup]="form" class="form service-user-form" (ngSubmit)="addUser()">
    <p class="pisac-field__hint add-user-hint">
      <i class="pi pi-info-circle" aria-hidden="true"></i>
      <span translate>service-user-assign.tooltip-about-adding-user</span>
    </p>
    <div class="pisac-form-grid--2">
      <div class="pisac-field">
        <label for="user-id" translate>service-user-assign.user-email</label>
        <p-dropdown id="user-id"
                    [options]="users$ | async"
                    optionLabel="email" optionValue="id"
                    [placeholder]="'service-user-assign.select-user' | translate"
                    [filter]="true"
                    [showClear]="userId.value?.length"
                    formControlName="userId"></p-dropdown>
      </div>
      <div class="pisac-field">
        <label for="user-role" translate>service-user-assign.user-role</label>
        <p-dropdown id="user-role"
                    [options]="existingRoles"
                    [placeholder]="'service-user-assign.select-role' | translate"
                    optionLabel="label" optionValue="key"
                    formControlName="userRole">
          <ng-template let-item pTemplate="item">
            <span>{{'role.' + item.label | translate}}</span>
          </ng-template>
          <ng-template let-item pTemplate="selectedItem">
            <span>{{'role.' + item.label | translate}}</span>
          </ng-template>
        </p-dropdown>
      </div>
    </div>
    <div class="form-actions">
      <button pButton class="save-button" [label]="'service-user-assign.save' | translate" type="submit" icon="pi pi-user-plus"
        [disabled]="form.invalid"></button>
    </div>
  </form>
</pisac-card>

<p-confirmDialog [breakpoints]="{'960px': '70vw', '640px': '92vw'}" [style]="{width: '480px'}"></p-confirmDialog>
