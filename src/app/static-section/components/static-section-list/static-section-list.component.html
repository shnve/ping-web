<!-- PISAC (F5.4): cabecera de página clara, tabla y paginador en tarjeta, acciones de fila solo con icono. -->
<ng-container *ngIf="pageItem">
  <div class="pisac-list-page">
  <p-confirmPopup></p-confirmPopup>
  <pisac-page-header variant="light" icon="pi pi-th-large" title="static-section-list.title.list"></pisac-page-header>
  <div class="pisac-table-card">
  <div class="pisac-table-scroll">
  <table class="administration-table">
    <thead>
    <tr>
      <th translate>static-section-list.table.key</th>
      <th translate>static-section-list.table.location</th>
      <th translate>static-section-list.table.name</th>
      <th translate>static-section-list.table.path</th>
      <th translate>static-section-list.table.action</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let staticSection of pageItem?.content">
      <td>{{staticSection.key}}</td>
      <td>{{staticSection.location}}</td>
      <td>{{staticSection.name}}</td>
      <td><a [routerLink]="[staticSection.path]" target="_blank" rel="noopener noreferrer">{{staticSection.path}}</a></td>
      <td>
        <button pButton *ngIf="enablePreview" class="p-button-sm p-button-text p-button-rounded" routerLink="./{{staticSection.id}}/details" [title]="'static-section-list.table.show' | translate" [attr.aria-label]="'static-section-list.table.show' | translate" icon="pi pi-eye"></button>
        <button pButton *ngIf="enableEdit" class="p-button-sm p-button-text p-button-rounded" routerLink="./{{staticSection.id}}/edition" [title]="'static-section-list.table.edit' | translate" [attr.aria-label]="'static-section-list.table.edit' | translate" icon="pi pi-pencil"></button>
      </td>
    </tr>
    </tbody>
  </table>
  </div>
  <app-ping-paginator
    [page]="pageItem"
    [currentSize]="this.currentSize"
    [currentPage]="this.currentPage"
    (changePage)="this.handlePageEvent($event)"
  ></app-ping-paginator>
  </div>
  </div>
</ng-container>
