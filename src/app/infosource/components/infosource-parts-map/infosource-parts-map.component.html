<sig-map #map class="map"
        [extent]="selectedAreaExtent"
        [modulesOptions]="modulesOptions"
        [disabled]="disabled"
        [geometriesLayer]="geometriesLayer"
        [enableKmlImport]="true"
        [enableLayersShowHide]="true"
        [parentLayers]="false"
        [showInfosources]="true"
        [showLayers]="false"
        [showZoneX]="false"
        [getDetailWarnings]="false"
        [showWarnings]="true"
        [shouldShowWarnings]="true"
        [popover]="true"
        [isNotDefaultStyle]="true"
        [kmlImportCallback]="onImportKmlClick.bind(this)"
        (onLoad)="mapLoaded()"
        [enableLayerMaritimesEntitiesManagedOrObservedByService]="true"
></sig-map>

<div class="manual-coords-panel" *ngIf="!disabled"
  style="margin-top: 15px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; background-color: #f9f9f9;">
  <strong style="display: block; margin-bottom: 10px;">{{ 'carto.manual-coords.title' | translate }}</strong>

  <div style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap;">
    <div>
      <label style="font-size: 0.85rem; display: block; margin-bottom: 3px;">{{ 'COORDINATES.LATITUDE' | translate }}</label>
      <input type="text"
             [(ngModel)]="latText"
             (ngModelChange)="latText = $event.toUpperCase()"
             [ngModelOptions]="{standalone: true}"
             class="form-control"
             placeholder="Ej: 49-59.61N"
             pattern="^(0[0-9]|[1-8][0-9]|90)-(0[0-9]|[1-5][0-9])(\.\d+)?[NS]$"
             style="width: 140px;"
             #latInput="ngModel">
      <small *ngIf="latInput.invalid && latInput.dirty" style="color: red; display: block; margin-top: 3px;">Formato inválido</small>
    </div>

    <div>
      <label style="font-size: 0.85rem; display: block; margin-bottom: 3px;">{{ 'COORDINATES.LONGITUDE' | translate }}</label>
      <input type="text"
             [(ngModel)]="lonText"
             (ngModelChange)="lonText = $event.toUpperCase()"
             [ngModelOptions]="{standalone: true}"
             class="form-control"
             placeholder="Ej: 001-13.50E"
             pattern="^(0[0-9]{2}|1[0-7][0-9]|180)-(0[0-9]|[1-5][0-9])(\.\d+)?[EW]$"
             style="width: 140px;"
             #lonInput="ngModel">
      <small *ngIf="lonInput.invalid && lonInput.dirty" style="color: red; display: block; margin-top: 3px;">Formato inválido</small>
    </div>

    <div style="display: flex; gap: 5px;">
      <button type="button" class="btn btn-primary" (click)="addPointToMap()"
        style="background-color: #0055ff; color: white; border: none; padding: 6px 12px; border-radius: 4px; height: 38px;">
        <i class="fas fa-map-marker-alt"></i> {{ 'carto.manual-coords.add-vertex' | translate }}
      </button>
      <button type="button" class="btn btn-secondary" (click)="clearManualCoords()"
        style="background-color: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; height: 38px;">
        <i class="fas fa-trash"></i> {{ 'carto.manual-coords.clear' | translate }}
      </button>
    </div>
  </div>
</div>

<input type="file" id="kmlFile" [accept]="kmlImportAccept" style="display:none">
