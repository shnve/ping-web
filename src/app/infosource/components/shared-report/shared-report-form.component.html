<!-- PISAC (F5.3.3): formulario común de contribuciones en tarjetas (ubicación + información), etiquetas arriba,
     rejilla de 2 columnas y barra de acciones inferior fija. No cambia la lógica: se conservan los
     formControlName, eventos, #geometriesForm, #sendPanel y condiciones *ngIf. Los campos propios de cada
     tipo de contribución llegan por <ng-content> y se colocan en la misma rejilla. -->
<shared-disclaimer [displayDisclaimer]="displayDeviceOrientationModeDisclaimer"
                   position="top-left"
                   [header]="'menu.infosource.disclaimer.title'"
                   [content]="'menu.infosource.disclaimer.description'"
                   (closeDialog)="onCloseDeviceOrientationModeDisclaimer($event)"
>
</shared-disclaimer>

<div class="report-form-page">
  <pisac-page-header variant="light" icon="pi pi-send" [title]="titleLabel"></pisac-page-header>

  <pisac-card *ngIf="infosSourceReport.nature === bathyNature">
    <div [staticSectionDirective]="'infosource-bathy-new-report'"></div>
  </pisac-card>

  <!-- ===== Ubicación (mapa) ===== -->
  <pisac-card title="infosource.report-hazard.label-form.map" icon="pi pi-map-marker">
    <infosource-map #geometriesForm class="map-container-in-field" [infosourceId]="infosourceId" [surveyDetections]="infosSourceReport.surveyDetections" [isBathy]="isBathy" [featurePart]="selectedPartConverted" (eventOnFeature)="onGeometryFormFeatureChange($event)"></infosource-map>
    <small *ngIf="isMissingLocalisation && submitted" class="p-error error-message-localization"
           translate>infosource.report-hazard.errors.localization-invalid
    </small>
  </pisac-card>

  <!-- ===== Información ===== -->
  <pisac-card title="infosource.report-hazard.label-form.information" icon="pi pi-info-circle">
    <div [formGroup]="sharedReportForm">
      <div class="pisac-form-grid--2 report-fields">
        <!-- Contributor service -->
        <div class="pisac-field" *ngIf="hasRoleServiceUser">
          <label for="contributorServiceId">{{ contributorLabel | translate }}</label>
          <p-dropdown *ngIf="proUserServices$ | async as proUserServices" [options]="proUserServices"
                      [showClear]="true"
                      [placeholder]="contributorChoicePlaceholder | translate" filter="true"
                      [optionLabel]="'option-label-name' | translate" optionValue="id" formControlName="contributorServiceId" id="contributorServiceId"
                      ngDefaultControl
                      (ngModelChange)="handleInput('contributorServiceId', $event)">
          </p-dropdown>
        </div>

        <!-- Concerned maritime entities -->
        <div class="pisac-field" *ngIf="hasRoleServiceUser">
          <label for="concernedMaritimeEntityIds" translate>infosource.report-hazard.concerned-maritime-entities</label>
          <p-multiSelect *ngIf="availableMaritimeEntities"
                         formControlName="concernedMaritimeEntityIds"
                         id="concernedMaritimeEntityIds"
                         [options]="availableMaritimeEntities"
                         [placeholder]="'infosource.report-hazard.concerned-maritime-entities' | translate"
                         [emptyFilterMessage]="'menu.area.dropdown.not-found' | translate"
                         [optionLabel]="'option-label-name' | translate"
                         optionValue="id"
                         (ngModelChange)="handleInput('concernedMaritimeEntityIds', $event)"
                         (onPanelShow)="refreshAvailableMaritimeEntitiesList()"
          >
          </p-multiSelect>
        </div>

        <!-- Observation date -->
        <div class="pisac-field">
          <label for="observationDate" translate>infosource.report-hazard.observation-date</label>
          <p-calendar [dateFormat]="dateFormat" [showTime]="true" dataType="string" formControlName="observationDate"
                      id="observationDate" ngDefaultControl [appendTo]="'body'" [showIcon]="true"
                      (ngModelChange)="handleInput('observationDate', $event)">
          </p-calendar>
        </div>

        <!-- timezone -->
        <div class="pisac-field">
          <label for="timezone" translate>infosource.report-hazard.timezone</label>
          <p-dropdown [options]="timezones" [placeholder]="'admin-warning.creation.labels.ph-timezone' | translate"
                      filter="true" formControlName="timezone" id="timezone" ngDefaultControl
                      optionValue="label" optionLabel="label"
                      (ngModelChange)="handleInput('timezone', $event)">
          </p-dropdown>
        </div>

        <!-- Campos propios del tipo de contribución (cada uno es un .pisac-field) -->
        <ng-content></ng-content>

        <!-- Anomaly description -->
        <div class="pisac-field pisac-field--required pisac-span-all">
          <label for="anomalyDescription" translate>infosource.report-hazard.anomaly-description</label>
          <textarea formControlName="anomalyDescription" id="anomalyDescription" pInputTextarea rows="6"
                    (ngModelChange)="handleInput('anomalyDescription', $event)">
          </textarea>
          <small class="p-error"
                 *ngIf="(anomalyDescription.invalid && submitted) || (anomalyDescription.dirty && anomalyDescription.invalid)"
                 translate>infosource.report-hazard.errors.anomaly-description-invalid</small>
        </div>

        <!-- Attachments -->
        <div class="pisac-field pisac-span-all">
          <label for="attachments" translate>infosource.report-hazard.attachments</label>
          <app-attachments [manageManyAttachments]="true" id="attachments" [attachmentFiles]="infosSourceReport.attachmentFiles"
                           [attachmentIds]="infosSourceReport.attachmentIds" (onChange)="setAttachmentsIds($event)">
          </app-attachments>
        </div>

        <!-- internal Comment -->
        <div class="pisac-field pisac-span-all" *ngIf="hasRoleServiceUser">
          <label for="internalComment" translate>infosource.report-hazard.internal-comment</label>
          <textarea formControlName="internalComment" id="internalComment" pInputTextarea rows="4"
                    (ngModelChange)="handleInput('internalComment', $event)">
          </textarea>
          <small class="p-error"
                 *ngIf="(internalComment.invalid && submitted) || (internalComment.dirty && internalComment.invalid)"
                 translate>infosource.report-hazard.errors.internal-comment-invalid</small>
        </div>

        <!-- Tags -->
        <div class="pisac-field" *ngIf="canAddAndLinkTag">
          <label for="maritime-service-tags" translate>maritime-service.tags</label>
          <div class="pisac-input-group">
            <p-multiSelect *ngIf="optionsMaritimeServiceTags.length"
                           inputId="maritime-service-tags"
                           formControlName="selectedTagsIds"
                           [options]="optionsMaritimeServiceTags"
                           [placeholder]="'infosource.details.update-service-status.link-tags' | translate"
                           [emptyFilterMessage]="'menu.area.dropdown.not-found' | translate"
                           optionLabel="value"
                           optionValue="key"
                           [group]="true"
                           (onChange)="updateMaritimeServiceTagsIds()"
            >
              <ng-template let-group pTemplate="group">
                <div><span>{{group.label}}</span></div>
              </ng-template>
              <ng-template let-item pTemplate="item">
                <div><span>{{item.value}}</span></div>
              </ng-template>
            </p-multiSelect>
            <button pButton type="button" class="p-button-outlined" icon="pi pi-plus"
                    [title]="'infosource.details.update-service-status.add-new-tag' | translate"
                    (click)="displayModal=true"></button>
          </div>
        </div>
      </div>
    </div>
  </pisac-card>

  <!-- Barra de acciones inferior fija: mensaje informativo a la izquierda, acciones a la derecha -->
  <div class="pisac-action-bar">
    <div class="pisac-action-bar__info">
      <i class="pi pi-info-circle" aria-hidden="true"></i>
      <span translate>infosource.report-hazard.contribution-information-message</span>
    </div>
    <div class="pisac-action-bar__group">
      <button [disabled]="isNotDraftStatus()" [label]="'infosource.report-hazard.buttons.save-draft' | translate"
              class="p-button-outlined save-button" icon="pi pi-save" pButton type="submit">
      </button>
      <p-button [disabled]="!sharedReportForm.valid || isMissingLocalisation" (click)="submitContribution($event)" [label]="'infosource.report-hazard.buttons.send-contribution' | translate"
                icon="pi pi-send" iconPos="right" type="submit">
      </p-button>
    </div>
  </div>
</div>

<p-dialog [header]="'infosource.details.update-service-status.add-new-tag' | translate"
          [(visible)]="displayModal" [modal]="true" [style]="{width: '50vw'}" [baseZIndex]="10000"
          [draggable]="false" [resizable]="false">
  <div class="pisac-field pisac-field--required">
    <label for="tag-name">{{ 'infosource.details.update-service-status.tag-name' | translate}}</label>
    <input id="tag-name" type="text"
           [(ngModel)]="tagName"
           [ngModelOptions]="{standalone: true}"
           pInputText>
  </div>
  <ng-template pTemplate="footer">
    <div>
      <button pButton type="button" class="p-button-sm p-button-secondary" (click)="displayModal=false" [label]="'cancel' | translate"></button>
      <button pButton type="button" [disabled]="tagName.length === 0" class="p-button-sm" (click)="saveNewTag()" [label]="'save' | translate"></button>
    </div>
  </ng-template>
</p-dialog>

<p-confirmPopup></p-confirmPopup>
<p-overlayPanel class="send-panel" [appendTo]="'body'" #sendPanel>
  <ng-template pTemplate>
    <div>
      <div *ngIf="infosourceNature === 'BATHY'" class="send-panel-header" [innerHTML]="'detail.msg-send-confirm' | translate | replace:'{{nbGeomBathy}}':selectedPartConverted.geometries.length"></div>
      <p-multiSelect  ngDefaultControl
                      [options]="availableMaritimeServicesRecipients"
                      [(ngModel)]="selectedMaritimeServicesRecipients"
                      optionValue="id"
                      [optionLabel]="'option-label-name' | translate"
                      [placeholder]="'detail.select-recipients' | translate"
                      [style]="{width: '250px'}"
      ></p-multiSelect>
    </div>
    <div class="actions">
      <button pButton type="button" class="p-button-sm p-button-secondary" (click)="cancelSend()" [label]="'detail.btn-send-cancel' | translate"></button>
      <button pButton type="button" class="p-button-sm" (click)="send(infosourceId)" [label]="'detail.btn-send-confirm' | translate" [disabled]="!selectedMaritimeServicesRecipients?.length"></button>
    </div>
  </ng-template>
</p-overlayPanel>
