<!-- PISAC (F5.3.3): campos propios con etiqueta arriba; se proyectan en la rejilla del formulario común. -->
<div class="report-container">
    <form #form (ngSubmit)="validate()" (keydown.enter)="enterKeyEvent($event)" [formGroup]="publicationReportForm">
        <infosource-shared-report-form #sharedReport formControlName="sharedReportForm" [infosourceId]="infosourceId"
            [infosSourceReport]="infosSourcePublicationAnomalyReport" [submitted]="submitted"
            [titleLabel]="'infosource.publication-report.title'" [locationMessage]="'infosource.report-hazard.anomaly-location'"
            (hasAttachmentsIdsChanged)="hasAttachmentsIdsChangedValues($event)">
            <!-- Issue reference -->
            <div class="pisac-field pisac-field--required">
                <label for="issueReference" translate>infosource.publication-report.issue-reference</label>
                <input type="text" formControlName="issueReference" id="issueReference" pInputText>
                <small class="p-error" *ngIf="(issueReference.invalid && submitted) || (issueReference.dirty && issueReference.invalid)"
                    translate>infosource.publication-report.errors.issue-reference-invalid</small>
            </div>

            <!-- Up to date at -->
            <div class="pisac-field">
                <label for="upToDateAt" translate>infosource.publication-report.up-to-date-at</label>
                <p-calendar [dateFormat]="dateFormat" [showTime]="false" dataType="string" [showIcon]="true"
                    formControlName="upToDateAt" id="upToDateAt" ngDefaultControl [appendTo]="'body'">
                </p-calendar>
            </div>

            <!-- chapter or page -->
            <div class="pisac-field">
                <label for="chapterOrPage" translate>infosource.publication-report.chapter-or-page</label>
                <input type="text" formControlName="chapterOrPage" id="chapterOrPage" pInputText>
                <small class="p-error" *ngIf="(chapterOrPage.invalid && submitted) || (chapterOrPage.dirty && chapterOrPage.invalid)"
                    translate>infosource.publication-report.errors.chapter-or-page-invalid</small>
            </div>
        </infosource-shared-report-form>
    </form>
</div>
