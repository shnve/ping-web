<!-- PISAC (F5.3.3): lista de partes a la izquierda (280 px) y mapa + formulario de la parte a la derecha,
     igual que en avisos y georregulaciones. Sin partes, solo el botón "Añadir parte". -->
<div class="main-container">
  <p-button
            (onClick)="addFeaturePart()"
            *ngIf="!featureParts?.length"
            icon="pi pi-plus"
            [label]="'admin-warning.creation.parts.add-part' | translate"
  ></p-button>
  <div *ngIf="featureParts?.length" class="parts-container">
    <div *ngIf="featureParts?.length" class="parts-list-container">
      <p-button (onClick)="addFeaturePart()"
                [disabled]="disabled"
                icon="pi pi-plus"
                [label]="'admin-warning.creation.parts.add-part' | translate"
                class="add-part-button"
      ></p-button>
      <infosource-feature-parts-list (onRemove)="removePart($event)"
                             (onSelect)="selectPart($event)"
                             [featureParts]="featureParts"
                             [readonly]="disabled"
                             [selectedParts]="[selectedPart]"
                             [validFeaturePart]="areFeaturePartsValid()"
      ></infosource-feature-parts-list>
    </div>
    <div *ngIf="featureParts?.length" class="part-map-container">
      <div *ngIf="selectedPart">
        <infosource-parts-map #geometriesForm [featurePart]="selectedPart" [featureParts]="featureParts"
                              [disabled]="disabled"
                              (eventOnFeature)="onGeometryFormFeatureChange($event)">
        </infosource-parts-map>
        <small *ngIf="isMissingLocalisation && submitted" class="p-error error-message-localization"
          translate>infosource.report-hazard.errors.localization-invalid
        </small>
      </div>
      <infosource-feature-part-form *ngIf="selectedPart"
                            (onChange)="changeSelectedPart($event)"
                            [featurePart]="selectedPart"
                            [timezone]="timezone"
                            [geometries]="getGeometries()"
                            [validFeaturePart]="hasValidInformation(selectedPart)"
                            [partIndex]="getNumberForSearchedPart(selectedPart)"
      ></infosource-feature-part-form>
    </div>
  </div>
</div>
