<sig-map #map class="map"
        [extent]="selectedAreaExtent"
        [infosourceId]="infosourceId"
        [modulesOptions]="modulesOptions"
        (onSelectWarnings)="displayWarningModal($event)" [popover]="true"
        [enableKmlImport]="true"
        [enableLayersShowHide]="true"
        [parentLayers]="false"
        [kmlImportCallback]="onImportKmlClick.bind(this)"
        [showLabels]="false"
        [getDetailWarnings]="false"
        [showLayers]="false"
        [showZoneX]="false"
        [showWarnings]="true"
        [shouldShowWarnings]="true"
        [showInfosources]="true"
        [showDetections]="!!surveyDetections?.length"
        [shouldShowDetections]="!!surveyDetections?.length"
        [surveyDetections]="surveyDetections"
        [enableGotoLegend]="true"
        [enableLabelsShowHide]="true"
        [isNotDefaultStyle]="true"
        (onLoad)="mapLoaded()"
        [enableLayerMaritimesEntitiesManagedOrObservedByService]="true"
></sig-map>
<input type="file" id="kmlFile" [accept]="kmlImportAccept" style="display:none">
