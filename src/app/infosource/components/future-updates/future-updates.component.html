<!-- PISAC (F5.3.3): campos propios con etiqueta arriba; se proyectan en la rejilla del formulario común. -->
<div class="report-container">
    <form #form (ngSubmit)="validate()" (keydown.enter)="enterKeyEvent($event)" [formGroup]="reportFutureUpdatesForm">
        <infosource-shared-report-form #sharedReport formControlName="sharedReportForm" [infosourceId]="infosourceId"
            [infosSourceReport]="infosourceFutureUpdates" [submitted]="submitted"
            (hasAttachmentsIdsChanged)="hasAttachmentsIdsChangedValues($event)" [locationMessage]="'infosource.future-updates.information-location'"
            [titleLabel]="'infosource.future-updates.title'" [isFutureUpdates]="true">

            <!-- Object future info -->
            <div class="pisac-field pisac-field--required pisac-span-all">
                <label for="objectFutureInfo" translate>infosource.future-updates.object-future-info</label>
                <input type="text" formControlName="objectFutureInfo" id="objectFutureInfo" pInputText>
                <small class="p-error" *ngIf="(objectFutureInfo.invalid && submitted) || (objectFutureInfo.dirty && objectFutureInfo.invalid)"
                    translate>infosource.future-updates.errors.future-info-invalid</small>
            </div>
        </infosource-shared-report-form>
    </form>
</div>
