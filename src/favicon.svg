<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Filtro de sombra sutil y relieve para efecto moderno -->
    <filter id="wave-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#001845" flood-opacity="0.22" />
    </filter>
    <filter id="ribbon-depth" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>

    <!-- Gradiente Amarillo Gobierno VE -->
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFDD00" />
      <stop offset="45%" stop-color="#FFC400" />
      <stop offset="85%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#F58200" />
    </linearGradient>

    <!-- Gradiente Azul Gobierno VE -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1862D6" />
      <stop offset="40%" stop-color="#0E46B0" />
      <stop offset="80%" stop-color="#072C82" />
      <stop offset="100%" stop-color="#041B58" />
    </linearGradient>

    <!-- Gradiente Rojo Gobierno VE -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E81B38" />
      <stop offset="50%" stop-color="#CF102B" />
      <stop offset="85%" stop-color="#A8071E" />
      <stop offset="100%" stop-color="#840314" />
    </linearGradient>

    <!-- Estrella de 5 puntas estándar -->
    <g id="star">
      <polygon points="0,-9.5 2.8,-3 9.5,-2.2 4.5,2.4 6,9.2 0,5.6 -6,9.2 -4.5,2.4 -9.5,-2.2 -2.8,-3" fill="#FFFFFF" />
    </g>
  </defs>

  <g filter="url(#wave-shadow)">
    <!-- 1. BANDA AMARILLA (Superior) -->
    <!-- Curva ondulante dinámica estilo cinta ondeante -->
    <path d="M 56 150
             C 120 178, 200 172, 280 144
             C 340 122, 400 122, 456 142
             L 448 220
             C 392 198, 332 198, 272 222
             C 192 254, 116 250, 64 226
             Z"
          fill="url(#yellowGrad)" />

    <!-- 2. BANDA AZUL (Intermedia con las 8 estrellas) -->
    <path d="M 64 218
             C 116 244, 192 246, 272 216
             C 332 192, 392 192, 448 214
             L 440 292
             C 384 270, 324 270, 264 294
             C 184 326, 108 322, 56 298
             Z"
          fill="url(#blueGrad)"
          filter="url(#ribbon-depth)" />

    <!-- ARCO DE 8 ESTRELLAS (Disposición oficial en arco sobre la franja azul) -->
    <!-- Rango centrado sobre la curvatura azul -->
    <g transform="translate(254, 252)">
      <!-- Estrella 1 -->
      <use href="#star" transform="translate(-86, 14) rotate(-32) scale(0.95)" />
      <!-- Estrella 2 -->
      <use href="#star" transform="translate(-62, -2) rotate(-22) scale(0.98)" />
      <!-- Estrella 3 -->
      <use href="#star" transform="translate(-38, -14) rotate(-12) scale(1.0)" />
      <!-- Estrella 4 -->
      <use href="#star" transform="translate(-13, -20) rotate(-4) scale(1.02)" />
      <!-- Estrella 5 -->
      <use href="#star" transform="translate(13, -20) rotate(4) scale(1.02)" />
      <!-- Estrella 6 -->
      <use href="#star" transform="translate(38, -14) rotate(12) scale(1.0)" />
      <!-- Estrella 7 -->
      <use href="#star" transform="translate(62, -2) rotate(22) scale(0.98)" />
      <!-- Estrella 8 -->
      <use href="#star" transform="translate(86, 14) rotate(32) scale(0.95)" />
    </g>

    <!-- 3. BANDA ROJA (Inferior) -->
    <path d="M 56 290
             C 108 316, 184 318, 264 288
             C 324 264, 384 264, 440 286
             L 432 364
             C 376 342, 316 342, 256 366
             C 176 398, 100 394, 48 370
             Z"
          fill="url(#redGrad)"
          filter="url(#ribbon-depth)" />
  </g>
</svg>
